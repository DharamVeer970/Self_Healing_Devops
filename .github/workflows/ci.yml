name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # pytest is a dev dependency - the runtime only needs requirements.txt
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check all sources
        run: python -m compileall -q main.py agent service watchdog

      - name: Run full test suite
        # Tests are hermetic (sandboxed tmp dirs, no secrets, no network).
        run: python -m pytest tests/ -q --tb=short
