name: Portfolio Watchdog

"on":
  schedule:
    - cron: "*/20 * * * *"     # every 20 minutes (GitHub cron can drift)
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  watchdog:
    # Credentials + notifications are wired ONCE in the shared reusable
    # workflow (.github/workflows/heal-agent.yml) - not repeated here.
    uses: ./.github/workflows/heal-agent.yml
    with:
      run_command: python -m watchdog.run --once --auto
    secrets: inherit
